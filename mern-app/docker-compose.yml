services:
  mongodb:
    image: mongo:8.0
    container_name: grievance-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: grievance_dev
      MONGO_INITDB_ROOT_PASSWORD: grievance_dev_pass
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
