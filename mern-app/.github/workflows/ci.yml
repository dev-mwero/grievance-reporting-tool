name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/grievance_test
      JWT_ACCESS_SECRET: test-jwt-access-secret-change-in-production-min-32-chars
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-change-in-production-min-32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -w server

      - name: Build cPanel bundle
        run: npm run build:cpanel
